# Starting values only; tune using validation data.
[experiment]
name = "03_early_fusion"
seed = 42
output_dir = "outputs/03_early_fusion_seed42"

[dataset]
root = "data/ucf101/ufc10"
regime = "original"
num_classes = 10
num_frames = 10
image_size = 224

[model]
name = "early_fusion"

[training]
# Upper limit; validation-loss early stopping may finish sooner.
epochs = 20
early_stopping_patience = 5
early_stopping_min_delta = 0.0001
# Batches contain videos; each 10-frame video becomes a 30-channel input.
batch_size = 2
validation_batch_size = 1
device = "auto"
learning_rate = 0.001
# Zero workers is a portable starting point for Windows and notebooks.
num_workers = 0
