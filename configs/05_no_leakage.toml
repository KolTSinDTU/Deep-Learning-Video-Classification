# Starting values only; tune using validation data.
# TODO: use the model and hyperparameters selected in task 4.1.
[experiment]
name = "05_no_leakage"
seed = 42
output_dir = "outputs/05_no_leakage_seed42"

[dataset]
root = "data/ucf101noleakage"
regime = "no_leakage"
num_classes = 10
num_frames = 10
image_size = "native"
frame_source = "native_video"
frame_cache_root = "data/native_frames/no_leakage"

[model]
name = "per_frame"

[training]
# Upper limit; validation-loss early stopping may finish sooner.
epochs = 20
early_stopping_patience = 5
early_stopping_min_delta = 0.0001
batch_size = 8
learning_rate = 0.001
# Zero workers is a portable starting point for Windows and notebooks.
num_workers = 0
