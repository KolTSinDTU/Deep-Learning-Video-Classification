# Starting values only; tune using validation data.
[experiment]
name = "02_late_fusion"
seed = 42
output_dir = "outputs/02_late_fusion_seed42"

[dataset]
root = "data/ucf101"
regime = "original"
num_classes = 10
num_frames = 10
image_size = 224

[model]
name = "late_fusion"

[training]
epochs = 20
batch_size = 8
learning_rate = 0.001
# Zero workers is a portable starting point for Windows and notebooks.
num_workers = 0
